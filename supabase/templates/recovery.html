<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f7f7f2;color:#1f2933;font-family:Arial,sans-serif;">
    <main style="max-width:560px;margin:32px auto;padding:32px;background:#fff;border:1px solid #e4e4dc;border-radius:12px;">
      <h1 style="margin-top:0;">Restablece tu contraseña</h1>
      <p>Este enlace solo puede usarse una vez y expira en 1 hora.</p>
      <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;padding:12px 18px;background:#1f2933;color:#fff;border-radius:8px;text-decoration:none;">Actualizar contraseña</a></p>
      <p style="color:#667085;font-size:13px;">Si no solicitaste este cambio, ignora este correo.</p>
    </main>
  </body>
</html>
