name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [benrod/1.2.0, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fidelity_ci
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fidelity_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fidelity_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Rebuild schema from migrations
        run: |
          psql "$DIRECT_URL" -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: CI=true pnpm test

  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fidelity_browser_ci
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fidelity_browser_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fidelity_browser_ci
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      INVITE_ONLY: "false"
      AUTH_SECURITY_SECRET: ci-auth-security-secret-32-bytes-minimum
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Prepare browser smoke database
        run: |
          psql "$DIRECT_URL" -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
          pnpm exec prisma migrate deploy

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run authentication browser smoke tests
        run: >-
          pnpm exec playwright test
          e2e/auth-errors.spec.ts
          e2e/auth-ui.spec.ts
          e2e/update-password.spec.ts

  role-permissions-smoke:
    needs: browser-smoke
    if: ${{ needs.browser-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      deployments: read
    env:
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_SELLADOR_EMAIL: ${{ secrets.E2E_SELLADOR_EMAIL }}
      E2E_SELLADOR_PASSWORD: ${{ secrets.E2E_SELLADOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve Vercel preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            for deployment in $(gh api --paginate "repos/${GITHUB_REPOSITORY}/deployments?sha=${DEPLOY_SHA}&per_page=100" --jq '.[].id'); do
              preview_url=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment}/statuses" --jq '[.[] | select(.state == "success" and .target_url != null)][0].target_url // empty')
              if [ -n "$preview_url" ]; then
                echo "E2E_BASE_URL=$preview_url" >> "$GITHUB_ENV"
                echo "Resolved Vercel preview deployment"
                exit 0
              fi
            done
            sleep 10
          done
          echo "Could not resolve a successful Vercel preview deployment for ${DEPLOY_SHA}"
          exit 1

      - name: Run development role permission smoke test
        run: pnpm exec playwright test --config=playwright.role.config.ts e2e/role-permissions.spec.ts
