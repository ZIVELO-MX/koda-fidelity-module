name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, benrod/1.2.0, rulaxx/1.2.0, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fidelity_ci
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fidelity_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fidelity_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Rebuild schema from migrations
        run: |
          psql "$DIRECT_URL" -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-url "$DIRECT_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: CI=true pnpm test

  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fidelity_browser_ci
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fidelity_browser_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/fidelity_browser_ci
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      INVITE_ONLY: "false"
      AUTH_SECURITY_SECRET: ci-auth-security-secret-32-bytes-minimum
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Prepare browser smoke database
        run: |
          psql "$DIRECT_URL" -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
          pnpm exec prisma migrate deploy

      - name: Build application
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run authentication browser smoke tests
        run: >-
          pnpm exec playwright test
          e2e/auth-errors.spec.ts
          e2e/auth-ui.spec.ts
          e2e/update-password.spec.ts

      # Los verificadores de área táctil estaban escritos y no los ejecutaba
      # ningún job, así que medían solo cuando alguien se acordaba de correrlos
      # a mano. Son públicos: no piden credenciales ni Supabase local, y con el
      # Postgres de este job las rutas que consultan la base también responden.
      - name: Check touch targets and responsive layout at 375, 768 and 1440
        run: >-
          pnpm exec playwright test
          e2e/areas-tactiles-acceso.spec.ts
          e2e/acceso-recorrido.spec.ts
          e2e/ola-1.spec.ts
          e2e/ola-4.spec.ts

      - name: Upload the browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  auth-e2e:
    name: auth-e2e (Supabase local + Mailpit)
    runs-on: ubuntu-latest
    # Veinte no alcanzaban: el job corre en serie y cada invocación de Playwright
    # levanta su propio servidor de producción. Cancelado por tiempo, GitHub lo
    # pinta rojo sin decir en qué paso se quedó.
    timeout-minutes: 35
    concurrency:
      group: fid-0016-auth-e2e-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      INVITE_ONLY: "false"
      TEAM_MEMBER_LIMIT: "20"
      AUTH_SECURITY_SECRET: ci-auth-security-secret-32-bytes-minimum
      DEV_SEED_ADMIN_PASSWORD: ci-admin-password-2
      DEV_SEED_SELLADOR_PASSWORD: ci-sellador-password-2
      E2E_ADMIN_PASSWORD: ci-admin-password-2
      E2E_SELLADOR_PASSWORD: ci-sellador-password-2
      E2E_REQUIRED_EMAIL: fidelity.seed.required@dev.invalid
      E2E_REQUIRED_PASSWORD: ci-required-password-2
      E2E_PORTAL_EMAIL: fidelity.seed.portal@dev.invalid
      E2E_PORTAL_PASSWORD: ci-portal-password-2
      E2E_CUSTOMER_EMAIL: fidelity.seed.customer@dev.invalid
      E2E_CUSTOMER_PASSWORD: ci-customer-password-2
      E2E_EXPIRED_EMAIL: fidelity.seed.expired@dev.invalid
      E2E_EXPIRED_PASSWORD: ci-expired-password-2
      FID_0019_LOCAL_E2E: "true"
      MAILPIT_URL: http://127.0.0.1:55434
      ALLOW_DESTRUCTIVE_SEED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Start local Supabase and Mailpit
        shell: bash
        run: |
          set -euo pipefail
          start_log="$RUNNER_TEMP/supabase-start.log"
          if ! supabase start > "$start_log" 2>&1; then
            cat "$start_log"
            exit 1
          fi
          # Qué servicios quedaron arriba, por si el fallo llega más adelante.
          supabase status || true

      - name: Upload the Supabase start log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-log
          path: ${{ runner.temp }}/supabase-start.log
          if-no-files-found: ignore

      - name: Export local Supabase keys
        shell: bash
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/supabase.env"
          supabase status -o env > "$status_file"
          set -a
          source "$status_file"
          set +a
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply application migrations and development fixtures
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed
          pnpm tsx scripts/prepare-auth-e2e.ts

      - name: Build application
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Test login, session refresh, password recovery, and customer portal
        run: pnpm exec playwright test --config=playwright.auth.config.ts e2e/auth-development.spec.ts

      # FID-0025. El fixture deja el alta de la cuenta de pruebas en el primer
      # paso, así que el recorrido arranca siempre del mismo sitio.
      - name: Prepare onboarding and plan fixtures
        env:
          E2E_ONBOARDING_EMAIL: fidelity.seed.portal@dev.invalid
          E2E_ONBOARDING_PLAN: LITE
        run: pnpm prepare:onboarding-e2e

      - name: Run FID-0025 onboarding tests
        env:
          E2E_ONBOARDING_EMAIL: fidelity.seed.portal@dev.invalid
        run: >-
          pnpm exec playwright test --config=playwright.auth.config.ts
          e2e/onboarding-recorrido.spec.ts

      # El trial vencido y el alta fresca son estados distintos de la misma
      # cuenta, así que se preparan y se corren por separado.
      - name: Prepare the expired Pro trial fixture
        env:
          E2E_ONBOARDING_EMAIL: fidelity.seed.portal@dev.invalid
          E2E_ONBOARDING_MODE: expired-trial
        run: pnpm prepare:onboarding-e2e

      - name: Run FID-0025 plan tests
        env:
          E2E_ONBOARDING_EMAIL: fidelity.seed.portal@dev.invalid
        run: >-
          pnpm exec playwright test --config=playwright.auth.config.ts
          e2e/planes.spec.ts

      - name: Upload the end-to-end evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-e2e-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: supabase stop
